name: Research source integrity
on:
  pull_request:
  push:
    branches: ["ci/**", "main"]
jobs:
  syntax-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source files
        run: |
          python - <<'PY'
          import pathlib, py_compile, subprocess
          files = subprocess.check_output(["git", "ls-files", "*.py"], text=True).splitlines()
          for item in files:
              py_compile.compile(item, doraise=True)
          print(f"Compiled {len(files)} tracked Python source files")
          PY
      - name: Validate YAML configs
        run: |
          python -m pip install PyYAML
          python - <<'PY'
          import pathlib, yaml
          paths = list(pathlib.Path("configs").glob("*.yaml")) + list(pathlib.Path("configs").glob("*.yml"))
          for path in paths:
              with path.open(encoding="utf-8") as f:
                  data = yaml.safe_load(f)
              assert isinstance(data, dict), f"Invalid config object: {path}"
          print(f"Parsed {len(paths)} YAML configuration files")
          PY
